<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0708">
<meta name="color-scheme" content="dark">
<title>Hubbio — seu painel</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--black:#0a0708;--ink:#130c0e;--ruby:#c8102e;--white:#f7f3f2;--mute:#b7a9ab;--line:rgba(247,243,242,.16);--field:rgba(247,243,242,.06);--ok:#6fd39b;--warn:#f0b35a;--display:"Cormorant Garamond",Georgia,serif;--body:"Jost","Helvetica Neue",Arial,sans-serif;color-scheme:dark}
*{box-sizing:border-box}[hidden]{display:none!important}
html{background:var(--black);overflow-x:clip}
body{margin:0;background:var(--black);color:var(--white);font:300 15px/1.5 var(--body);min-height:100dvh;position:relative;overflow-x:clip;padding:max(28px,calc(env(safe-area-inset-top,0px) + 20px)) max(16px,env(safe-area-inset-right,0px)) max(56px,calc(env(safe-area-inset-bottom,0px) + 40px)) max(16px,env(safe-area-inset-left,0px))}
body::before{content:"";position:absolute;top:-160px;left:50%;width:640px;height:640px;max-width:160vw;transform:translateX(-50%);background:radial-gradient(circle,rgba(200,16,46,.3),transparent 68%);pointer-events:none}
.wrap{position:relative;max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{font-family:var(--display);font-style:italic;font-weight:600;font-size:28px}
.who{font-size:12px;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
h1{margin:0;font-family:var(--display);font-weight:500;font-size:clamp(34px,9vw,44px);line-height:1.05}
h2{margin:0;font-family:var(--display);font-weight:600;font-size:26px}
.sub{margin:0;color:var(--mute)}
.box{background:var(--ink);border:1px solid var(--line);padding:22px 20px;display:flex;flex-direction:column;gap:14px}
.lbl{display:flex;flex-direction:column;gap:6px;min-width:0;font-size:10.5px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;color:var(--mute)}
.in{width:100%;min-width:0;font:inherit;font-size:16px;font-weight:300;letter-spacing:0;text-transform:none;color:var(--white);background:var(--field);border:1px solid var(--line);border-radius:0;padding:11px 12px}
textarea.in{resize:vertical}.in::placeholder{color:rgba(183,169,171,.6)}
.in:focus{outline:2px solid var(--ruby);border-color:var(--ruby)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.dom{display:flex;align-items:center}.dom .in{flex:1}.dom b{padding-left:8px;color:var(--mute);font-weight:400;letter-spacing:0;text-transform:none;white-space:nowrap}
.sec{margin:4px 0 0;font-size:11px;font-weight:500;letter-spacing:.3em;text-transform:uppercase;color:var(--ruby)}
.msg{min-height:1.3em;margin:0;font-size:13px;color:var(--mute)}.msg.err{color:#ff6b7f}.msg.ok{color:var(--ok)}
.btn{font:inherit;font-size:12px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;color:var(--white);background:var(--ruby);border:1px solid var(--ruby);padding:12px 18px;cursor:pointer;min-height:46px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
.btn:hover,.btn:focus-visible{background:#e0152f;border-color:#e0152f}.btn:focus-visible,.lnk:focus-visible,.tab:focus-visible{outline:2px solid var(--white);outline-offset:2px}
.btn.ghost{background:transparent;border-color:var(--line)}.btn.ghost:hover{border-color:var(--white)}
.btn.sm{padding:8px 12px;min-height:38px;font-size:11px}.btn[disabled]{opacity:.5;cursor:default}
.lnk{background:none;border:0;color:var(--mute);font:inherit;font-size:12px;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;padding:8px 0;border-bottom:1px solid var(--line)}
.switch{text-align:center}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tab{flex:1;background:none;border:0;border-bottom:2px solid transparent;color:var(--mute);font:inherit;font-size:12px;font-weight:500;letter-spacing:.22em;text-transform:uppercase;padding:12px 4px;cursor:pointer}
.tab[aria-selected=true]{color:var(--white);border-color:var(--ruby)}
.card{border:1px solid var(--line);padding:16px;display:flex;flex-direction:column;gap:12px;background:linear-gradient(180deg,rgba(247,243,242,.04),rgba(247,243,242,.01))}
.card b{font-family:var(--display);font-size:22px;font-weight:600;overflow-wrap:anywhere}
.card small{display:block;color:var(--mute);font-size:12px;margin-top:2px}
.badge{display:inline-block;font-size:10px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;border:1px solid currentColor;padding:2px 8px;margin-right:6px}
.b-ok{color:var(--ok)}.b-warn{color:var(--warn)}.b-err{color:#ff6b7f}.b-mute{color:var(--mute)}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.empty{color:var(--mute);text-align:center;padding:24px 0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));background:var(--white);color:var(--black);padding:10px 18px;max-width:calc(100% - 32px);text-align:center;font-size:12px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;z-index:50}
@media (max-width:420px){.two{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top"><span class="logo">Hubbio</span><span class="who" id="who"></span><button class="lnk" id="out" hidden>Sair</button></header>

  <!-- ENTRAR / CRIAR CONTA -->
  <section id="auth" class="box" hidden>
    <h1 id="authT">Entrar</h1>
    <p class="sub" id="authS">Acesse seu painel para criar e editar suas páginas.</p>
    <form id="authF" style="display:flex;flex-direction:column;gap:14px">
      <label class="lbl" id="nomeW" hidden>Seu nome<input class="in" id="aNome" autocomplete="name"></label>
      <label class="lbl">E-mail<input class="in" id="aMail" type="email" autocomplete="email" required></label>
      <label class="lbl">Senha<input class="in" id="aPass" type="password" minlength="8" autocomplete="current-password" required></label>
      <p class="msg" id="aMsg" role="status"></p>
      <button class="btn" id="aGo" type="submit">Entrar</button>
    </form>
    <p class="switch"><button class="lnk" id="aSwap" type="button">Criar conta grátis</button></p>
  </section>

  <!-- PAINEL -->
  <section id="app" hidden>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" id="t1" aria-selected="true" data-tab="p">Páginas</button>
      <button class="tab" role="tab" id="t2" aria-selected="false" data-tab="c">Pagamentos</button>
    </div>

    <div id="tabP" style="display:flex;flex-direction:column;gap:14px;margin-top:20px">
      <div id="list"></div>
      <button class="btn" id="newBtn" type="button">+ Nova página · R$ 5,99/mês</button>

      <form class="box" id="form" autocomplete="off" hidden>
        <h2>Nova página</h2>
        <label class="lbl">Endereço desejado<span class="dom"><input class="in" id="sub" maxlength="30" autocapitalize="off" required><b>.hubbio.shop</b></span></label>
        <p class="msg" id="subMsg" role="status"></p>
        <p class="sec">Sua página</p>
        <label class="lbl">Nome na página<input class="in" id="name" maxlength="60" required></label>
        <label class="lbl">Descrição<input class="in" id="tag" maxlength="200"></label>
        <label class="lbl">Foto<input type="file" id="photo" accept="image/*"></label>
        <div id="links" style="display:flex;flex-direction:column;gap:8px"></div>
        <label class="lbl">Redes (uma URL por linha, até 4)<textarea class="in" id="soc" rows="3" placeholder="https://instagram.com/..."></textarea></label>
        <label class="lbl">Texto do rodapé<input class="in" id="foot" maxlength="120"></label>
        <label class="lbl">Orientação para a IA (opcional)<textarea class="in" id="prompt" rows="2" maxlength="600" placeholder="Ex.: visual rosa e minimalista"></textarea></label>
        <div id="docBox" hidden>
          <p class="sec">Dados para a cobrança (só na primeira vez)</p>
          <div class="two" style="margin-top:10px">
            <label class="lbl">Seu nome<input class="in" id="nome"></label>
            <label class="lbl">CPF/CNPJ<input class="in" id="doc" inputmode="numeric"></label>
          </div>
        </div>
        <p class="msg" id="msg" role="status"></p>
        <div class="acts"><button class="btn" id="go" type="submit">Ir para o pagamento</button><button class="btn ghost" id="cancel" type="button">Cancelar</button></div>
      </form>
    </div>

    <div id="tabC" hidden style="margin-top:20px"><div id="pays" style="display:flex;flex-direction:column;gap:10px"></div></div>
  </section>
</div>
<div class="toast" id="toast" hidden role="status"></div>

<script>
(function () {
  var SB = 'https://abdliioyzkylccfylils.supabase.co';
  var KEY = 'sb_publishable_g6l6_QmwE4Tj85_KF_XHfQ_I4gFlY_n';
  var $ = function (s) { return document.querySelector(s); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var money = function (v) { return 'R$ ' + Number(v || 0).toFixed(2).replace('.', ','); };
  var day = function (d) { return d ? new Date(d + 'T12:00:00').toLocaleDateString('pt-BR') : '—'; };
  var okUrl = function (u) { return /^https:\/\//i.test(u || '') ? u : ''; };
  var say = function (el, t, c) { el.textContent = t || ''; el.className = 'msg' + (c ? ' ' + c : ''); };
  var toastT; function toast(t) { var e = $('#toast'); e.textContent = t; e.hidden = false; clearTimeout(toastT); toastT = setTimeout(function () { e.hidden = true; }, 2600); }

  // ---------- sessão (Supabase Auth via REST) ----------
  var S = null;
  try { S = JSON.parse(localStorage.getItem('hb') || 'null'); } catch (e) {}
  function save(s) { S = s; try { s ? localStorage.setItem('hb', JSON.stringify(s)) : localStorage.removeItem('hb'); } catch (e) {} }
  function setSession(d) { save({ at: d.access_token, rt: d.refresh_token, exp: Date.now() + (d.expires_in || 3600) * 1000, email: (d.user && d.user.email) || (S && S.email) || '' }); }

  function raw(path, o) {
    o = o || {};
    var h = { apikey: KEY, 'Content-Type': 'application/json' };
    if (o.t) h.Authorization = 'Bearer ' + o.t;
    return fetch(SB + path, { method: o.m || 'GET', headers: h, body: o.b ? JSON.stringify(o.b) : undefined }).then(function (r) {
      return r.text().then(function (t) {
        var d = {}; try { d = t ? JSON.parse(t) : {}; } catch (e) {}
        if (!r.ok) { var er = new Error(d.error_description || d.msg || d.message || d.error || ('Erro ' + r.status)); er.status = r.status; er.data = d; throw er; }
        return d;
      });
    }, function () { throw new Error('Sem conexão. Verifique a internet e tente de novo.'); });
  }
  function token() {
    if (!S) { var e = new Error('login'); e.status = 401; return Promise.reject(e); }
    if (Date.now() < S.exp - 60000) return Promise.resolve(S.at);
    return raw('/auth/v1/token?grant_type=refresh_token', { m: 'POST', b: { refresh_token: S.rt } })
      .then(function (d) { setSession(d); return S.at; })
      .catch(function () { save(null); var e = new Error('Sessão expirada. Entre de novo.'); e.status = 401; throw e; });
  }
  function rest(p) { return token().then(function (t) { return raw('/rest/v1/' + p, { t: t }); }); }
  function fn(b) { return token().then(function (t) { return raw('/functions/v1/hubbio-checkout', { m: 'POST', b: b, t: t }); }); }
  function authErr(e) {
    var m = String(e.message || '');
    if (/invalid login/i.test(m)) return 'E-mail ou senha incorretos.';
    if (/already registered|already been registered/i.test(m)) return 'Esse e-mail já tem conta. Use "Entrar".';
    if (/password/i.test(m) && /(short|least|weak)/i.test(m)) return 'A senha precisa ter pelo menos 8 caracteres.';
    if (/not confirmed/i.test(m)) return 'Confirme seu e-mail antes de entrar.';
    return m || 'Não foi possível continuar.';
  }

  // ---------- telas ----------
  var mode = 'in', timer = null, pages = [], pays = [];
  function showAuth() {
    clearInterval(timer);
    $('#auth').hidden = false; $('#app').hidden = true; $('#out').hidden = true; $('#who').textContent = '';
  }
  function setMode(m) {
    mode = m; var up = m === 'up';
    $('#authT').textContent = up ? 'Criar conta' : 'Entrar';
    $('#authS').textContent = up ? 'É grátis. Você só paga quando criar uma página.' : 'Acesse seu painel para criar e editar suas páginas.';
    $('#nomeW').hidden = !up; $('#aGo').textContent = up ? 'Criar conta' : 'Entrar';
    $('#aSwap').textContent = up ? 'Já tenho conta' : 'Criar conta grátis';
    $('#aPass').setAttribute('autocomplete', up ? 'new-password' : 'current-password');
    say($('#aMsg'), '');
  }
  $('#aSwap').onclick = function () { setMode(mode === 'in' ? 'up' : 'in'); };
  $('#authF').onsubmit = function (e) {
    e.preventDefault();
    var go = $('#aGo'), email = $('#aMail').value.trim(), pass = $('#aPass').value;
    go.disabled = true; say($('#aMsg'), mode === 'up' ? 'Criando conta...' : 'Entrando...');
    var p = mode === 'up'
      ? raw('/auth/v1/signup', { m: 'POST', b: { email: email, password: pass, data: { nome: $('#aNome').value.trim() } } })
      : raw('/auth/v1/token?grant_type=password', { m: 'POST', b: { email: email, password: pass } });
    p.then(function (d) {
      go.disabled = false;
      if (d.access_token) { setSession(d); say($('#aMsg'), ''); start(); }
      else { say($('#aMsg'), 'Conta criada! Confirme o e-mail que enviamos e depois entre.', 'ok'); setMode('in'); }
    }).catch(function (er) { go.disabled = false; say($('#aMsg'), authErr(er), 'err'); });
  };
  $('#out').onclick = function () { save(null); pages = []; pays = []; showAuth(); };

  function label(p) {
    var s = p.status, st = p.provision_step;
    if (s === 'active') return ['No ar', 'b-ok'];
    if (s === 'pending') return ['Aguardando pagamento', 'b-warn'];
    if (s === 'provisioning') return [st === 'estilo' ? 'Estilizando site...' : 'Criando domínio...', 'b-warn'];
    if (s === 'error') return ['Ajustando, tentando de novo...', 'b-warn'];
    if (s === 'suspended') return ['Suspensa (pagamento em atraso)', 'b-err'];
    if (s === 'cancelled') return ['Cancelada', 'b-mute'];
    return [s || '—', 'b-mute'];
  }
  function payLabel(s) {
    if (/^(RECEIVED|CONFIRMED|RECEIVED_IN_CASH)$/.test(s)) return ['Pago', 'b-ok'];
    if (s === 'PENDING') return ['Pendente', 'b-warn'];
    if (s === 'OVERDUE') return ['Vencido', 'b-err'];
    if (/REFUND/.test(s || '')) return ['Estornado', 'b-mute'];
    return [s || '—', 'b-mute'];
  }

  function renderPages() {
    $('#list').innerHTML = pages.length ? pages.map(function (p) {
      var l = label(p), host = p.subdomain + '.hubbio.shop', acts = '';
      if (p.status === 'active' && okUrl(p.page_url)) acts += '<a class="btn sm" href="' + esc(p.page_url) + '" target="_blank" rel="noopener">Abrir página</a>';
      if (p.status === 'pending' || p.status === 'suspended') acts += '<button class="btn sm" data-pay="' + esc(p.id) + '" type="button">Pagar agora</button>';
      return '<div class="card" style="margin-bottom:12px"><div><b>' + esc(host) + '</b><small><span class="badge ' + l[1] + '">' + esc(l[0]) + '</span>' + money(p.valor) + '/mês</small></div>' +
        (acts ? '<div class="acts">' + acts + '</div>' : '') + '</div>';
    }).join('') : '<p class="empty">Você ainda não tem páginas. Crie a primeira abaixo.</p>';
  }
  function renderPays() {
    var by = {}; pages.forEach(function (p) { by[p.id] = p.subdomain; });
    $('#pays').innerHTML = pays.length ? pays.map(function (x) {
      var l = payLabel(x.status), u = okUrl(x.invoice_url), open = /^(PENDING|OVERDUE)$/.test(x.status) && u;
      return '<div class="card"><div><b>' + money(x.valor) + '</b><small><span class="badge ' + l[1] + '">' + esc(l[0]) + '</span>' +
        esc(by[x.assinatura_id] ? by[x.assinatura_id] + '.hubbio.shop' : 'Página') + ' · vence ' + day(x.vencimento) + '</small></div>' +
        (open ? '<div class="acts"><a class="btn sm" href="' + esc(u) + '" target="_blank" rel="noopener">Pagar</a></div>' : '') + '</div>';
    }).join('') : '<p class="empty">Nenhum pagamento ainda.</p>';
  }

  function load() {
    return Promise.all([
      rest('assinaturas?select=id,subdomain,status,provision_step,page_url,valor,created_at&order=created_at.desc'),
      rest('pagamentos?select=id,assinatura_id,valor,status,vencimento,invoice_url&order=vencimento.desc.nullslast')
    ]).then(function (r) {
      pages = r[0] || []; pays = r[1] || [];
      renderPages(); renderPays();
    }).catch(function (e) { if (e.status === 401) { showAuth(); say($('#aMsg'), 'Entre novamente.', 'err'); } });
  }
  function start() {
    $('#auth').hidden = true; $('#app').hidden = false; $('#out').hidden = false;
    $('#who').textContent = S.email || '';
    load();
    clearInterval(timer);
    timer = setInterval(function () {
      var busy = pages.some(function (p) { return /^(pending|provisioning|error)$/.test(p.status); });
      if (!document.hidden && busy && S) load();
    }, 6000);
  }
  document.addEventListener('visibilitychange', function () { if (!document.hidden && S && !$('#app').hidden) load(); });

  // abas
  document.querySelectorAll('.tab').forEach(function (t) {
    t.onclick = function () {
      var c = t.getAttribute('data-tab') === 'c';
      $('#tabP').hidden = c; $('#tabC').hidden = !c;
      $('#t1').setAttribute('aria-selected', String(!c)); $('#t2').setAttribute('aria-selected', String(c));
    };
  });

  // pagar uma página já criada (abre a fatura em nova aba; o painel segue acompanhando)
  function openInvoice(w, url) { if (w && !w.closed) w.location.href = url; else location.href = url; }
  $('#list').addEventListener('click', function (e) {
    var b = e.target.closest('[data-pay]'); if (!b) return;
    var w = window.open('', '_blank'); b.disabled = true;
    fn({ action: 'fatura', id: b.getAttribute('data-pay') }).then(function (d) { b.disabled = false; openInvoice(w, d.url); })
      .catch(function (er) { b.disabled = false; if (w) w.close(); toast(er.message); });
  });

  // ---------- nova página ----------
  var N = 4, rows = '';
  for (var i = 0; i < N; i++) rows += '<div class="two"><input class="in" data-t="' + i + '" placeholder="Título do link ' + (i + 1) + '" maxlength="60" aria-label="Título do link ' + (i + 1) + '"><input class="in" data-u="' + i + '" placeholder="https://..." inputmode="url" autocapitalize="off" aria-label="Endereço do link ' + (i + 1) + '"></div>';
  $('#links').innerHTML = rows;
  $('#newBtn').onclick = function () { $('#form').hidden = false; $('#newBtn').hidden = true; $('#sub').focus(); };
  $('#cancel').onclick = function () { $('#form').hidden = true; $('#newBtn').hidden = false; };

  var tm, subOk = false;
  $('#sub').addEventListener('input', function (e) {
    var v = e.target.value = e.target.value.toLowerCase().replace(/[^a-z0-9-]/g, ''), out = $('#subMsg');
    subOk = false; clearTimeout(tm);
    if (v.length < 3) { say(out, 'Mínimo de 3 caracteres.'); return; }
    say(out, 'Verificando...');
    tm = setTimeout(function () {
      fn({ action: 'check', subdomain: v }).then(function (d) {
        if (v !== $('#sub').value) return;
        subOk = d.available;
        say(out, d.available ? '✓ ' + v + '.hubbio.shop está disponível' : (d.reason || 'Indisponível'), d.available ? 'ok' : 'err');
      }).catch(function () { if (v === $('#sub').value) say(out, 'Não foi possível verificar agora.', 'err'); });
    }, 400);
  });

  var avatar = '', busy = false;
  $('#photo').onchange = function (e) {
    var f = e.target.files[0]; avatar = ''; if (!f) return; busy = true;
    var fr = new FileReader();
    fr.onload = function () {
      var img = new Image();
      img.onload = function () {
        var c = document.createElement('canvas'); c.width = c.height = 256;
        var s = Math.min(img.width, img.height);
        c.getContext('2d').drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, 256, 256);
        avatar = c.toDataURL('image/jpeg', 0.85); busy = false;
      };
      img.onerror = function () { busy = false; };
      img.src = fr.result;
    };
    fr.onerror = function () { busy = false; };
    fr.readAsDataURL(f);
  };

  var fix = function (u) { return /^https?:\/\//i.test(u) ? u : 'https://' + u; };
  $('#form').onsubmit = function (e) {
    e.preventDefault();
    var msg = $('#msg'), go = $('#go');
    if (!subOk) { say(msg, 'Escolha um endereço disponível.', 'err'); return; }
    if (busy) { say(msg, 'Aguarde o processamento da foto e tente de novo.', 'err'); return; }
    var links = [];
    for (var i = 0; i < N; i++) {
      var t = $('[data-t="' + i + '"]').value.trim(), u = $('[data-u="' + i + '"]').value.trim();
      if (t && u) links.push({ title: t, url: fix(u) });
    }
    var social = $('#soc').value.split('\n').map(function (s) { return s.trim(); }).filter(Boolean).slice(0, 4).map(fix);
    var w = window.open('', '_blank'); // abre já no clique para o navegador não bloquear
    go.disabled = true; say(msg, 'Criando cobrança...');
    fn({
      action: 'create', subdomain: $('#sub').value, prompt: $('#prompt').value,
      nome: $('#nome').value, cpfCnpj: $('#doc').value,
      config: { name: $('#name').value, tagline: $('#tag').value, footer: $('#foot').value, avatar: avatar, links: links, social: social }
    }).then(function (d) {
      go.disabled = false; say(msg, '');
      openInvoice(w, d.url);
      $('#form').reset(); avatar = ''; subOk = false; say($('#subMsg'), '');
      $('#form').hidden = true; $('#newBtn').hidden = false; $('#docBox').hidden = true;
      toast('Página criada! Conclua o pagamento.'); load();
    }).catch(function (er) {
      go.disabled = false; if (w) w.close();
      if (er.data && er.data.need === 'doc') $('#docBox').hidden = false;
      say(msg, er.message, 'err');
    });
  };

  setMode('in');
  if (S) start(); else showAuth();
})();
</script>
</body>
</html>
